<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>jev-browser</title>
		<style>
			html,
			body {
				height: 100%;
				margin: 0;
			}
			body {
				display: grid;
				place-items: center;
				background: #111110;
				color: #f3f1ea;
				font-family:
					ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
			}
			main {
				text-align: center;
				padding: 32px;
			}
			.kicker {
				margin: 0 0 20px;
				font-size: 13px;
				letter-spacing: 0.22em;
				text-transform: uppercase;
				color: #9a978c;
			}
			h1 {
				margin: 0;
				font-size: clamp(52px, 9vw, 104px);
				font-weight: 560;
				letter-spacing: -0.045em;
				line-height: 0.95;
			}
			.line {
				margin: 28px 0 0;
				font-size: clamp(18px, 2.5vw, 28px);
				font-weight: 400;
				color: #d8d4c8;
			}
			.steps {
				margin: 56px 0 0;
				font-size: 15px;
				letter-spacing: 0.16em;
				color: #8a867c;
			}
		</style>
	</head>
	<body>
		<main>
			<p class="kicker">Cursor skill · Agent skill</p>
			<h1>jev-browser</h1>
			<p class="line">Give a site. Write a goal. Jev clicks.</p>
			<p class="steps">site → goal → jb run</p>
		</main>
	</body>
</html>
